CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_MAIN_STACK_SIZE=4096
# The Adafruit bootloader takes UF2 files; the base board variant does not emit one by itself.
CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_REGULATOR=y
CONFIG_HWINFO=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="EPaper-BLE"
# ATT MTU = min(BUF_ACL_RX_SIZE - 4, L2CAP_TX_MTU) = 256, what the clients ask for.
CONFIG_BT_L2CAP_TX_MTU=256
CONFIG_BT_BUF_ACL_RX_SIZE=260
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# nRF52840 ceiling.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Release build: no USB. The board's CDC ACM console enables USB at boot, and
# the nRF USB driver then holds the 32 MHz crystal even on battery. debug.conf
# turns it back on for the bench.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n

# This board has the 32 kHz crystal. On one without it bt_enable() never
# returns with XTAL selected; switch back to CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
# then. The crystal removes the RC calibration (HFXO on every 4 s) and lets the
# controller assume 50 ppm instead of 500 for its receive windows.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
